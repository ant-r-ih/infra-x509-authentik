---
# Defaults for this Terraform/NLB inventory only. External native inventories
# (including kind) do not load group_vars from this directory.
deployment_profile: aws_nlb
tls_mode: acme
kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/x509-authentik-eks"
service_type: ClusterIP
storage_class: gp3
proxy_protocol_enabled: true
proxy_protocol_trusted_cidrs: ["{{ vpc_cidr }}"]
radius_client_networks: "0.0.0.0/0"
