---
# Update RADIUS shared secret in Authentik
# Usage:
#   RADIUS_SECRET=<secret> ansible-playbook playbooks/update-radius-secret.yml

- name: Update RADIUS shared secret
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    authentik_namespace: authentik
    authentik_url: "http://localhost:8000"  # port-forward before running

  tasks:
    - name: Get Authentik admin token from secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: authentik-admin-token
        namespace: "{{ authentik_namespace }}"
      register: admin_token_secret
      no_log: true

    - name: Update RADIUS provider shared secret
      uri:
        url: "{{ authentik_url }}/api/v3/providers/radius/?name=radius-provider"
        method: GET
        headers:
          Authorization: "Bearer {{ admin_token_secret.resources[0].data.token | b64decode }}"
        return_content: true
      register: radius_providers

    - name: Patch RADIUS provider
      uri:
        url: "{{ authentik_url }}/api/v3/providers/radius/{{ radius_providers.json.results[0].pk }}/"
        method: PATCH
        headers:
          Authorization: "Bearer {{ admin_token_secret.resources[0].data.token | b64decode }}"
          Content-Type: "application/json"
        body_format: json
        body:
          shared_secret: "{{ lookup('env', 'RADIUS_SECRET') }}"
      no_log: true
