---
# Common application deployment. Supply an explicit kubeconfig and inventory.
- name: Deploy Authentik on Kubernetes
  hosts: x509-authentik
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig }}"
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig }}"
    kubernetes.core.helm:
      kubeconfig: "{{ kubeconfig }}"
  roles:
    - authentik
