# Authentik Blueprint: Credential Enrollment Flow
#
# Triggered after onboarding, or accessible from user settings.
# Allows enrollment of: Password, TOTP (OTP), WebAuthn (Passkey)
#
# This flow is the "default" enrollment target after cert onboarding.

version: 1
metadata:
  name: credential-enrollment
  labels:
    blueprints.goauthentik.io/description: "Credential enrollment: password / OTP / passkey"

entries:
  - model: authentik_flows.flow
    identifiers:
      slug: credential-enrollment
    attrs:
      name: "Credential Enrollment"
      title: "Set up your credentials"
      slug: credential-enrollment
      designation: stage_configuration
      authentication: require_authenticated
      layout: stacked

  # Password stage
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: enrollment-prompt-password
    attrs:
      name: enrollment-prompt-password
      fields:
        - !Find [authentik_stages_prompt.prompt, [field_key, password]]
        - !Find [authentik_stages_prompt.prompt, [field_key, password_repeat]]

  # TOTP authenticator setup
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    identifiers:
      name: enrollment-totp
    attrs:
      name: enrollment-totp
      friendly_name: "OTP Authenticator"
      digits: 6

  # WebAuthn/Passkey authenticator setup
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    identifiers:
      name: enrollment-webauthn
    attrs:
      name: enrollment-webauthn
      friendly_name: "Passkey / FIDO2"
      user_verification: preferred
      resident_key_requirement: preferred

  # User write
  - model: authentik_stages_user_write.userwritestage
    identifiers:
      name: enrollment-user-write
    attrs:
      name: enrollment-user-write
      user_creation_mode: never_create

  # Bindings
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, credential-enrollment]]
      order: 10
    attrs:
      target: !Find [authentik_flows.flow, [slug, credential-enrollment]]
      stage: !Find [authentik_stages_prompt.promptstage, [name, enrollment-prompt-password]]
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, credential-enrollment]]
      order: 20
    attrs:
      target: !Find [authentik_flows.flow, [slug, credential-enrollment]]
      stage: !Find [authentik_stages_user_write.userwritestage, [name, enrollment-user-write]]
      order: 20

  # TOTP and WebAuthn stages are accessible from user settings (/user#mfa)
  # but can be added here too if you want to force enrollment at onboarding
