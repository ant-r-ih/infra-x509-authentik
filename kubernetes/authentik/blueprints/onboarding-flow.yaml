# Authentik Blueprint: Certificate-based Onboarding Flow
#
# Flow: user hits /if/flow/cert-onboarding/ with client cert
# nginx passes X-Amzn-Mtls-Clientcert-Leaf (URL-encoded PEM)
# Example decoded: C=JP,O=client CA,CN=1234 Alice Example 01,emailAddress=user@example.org
#
# Design notes for Authentik 2026.x:
#   - Expression Stage was removed; Expression Policy is used instead.
#   - PolicyBinding must target a FlowStageBinding (not a Stage directly).
#   - FlowStageBinding.evaluate_on_plan=True makes the policy run during
#     FlowPlanner.plan(), giving it access to request.context["flow_plan"].
#     Writing to plan.context["pending_user"] there persists into the
#     flow execution context, making UserLoginStage find the user.
#   - PolicyBindings on flows (flow-level) do NOT propagate context to
#     the FlowPlan — only evaluate_on_plan bindings do.
#
# Parsed CN fields:
#   username  : first numeric token of CN  (e.g. "1234")
#   name      : middle tokens of CN        (e.g. "Alice Example")
#   email     : emailAddress RDN value

version: 1
metadata:
  name: cert-onboarding
  labels:
    blueprints.goauthentik.io/description: "X.509 cert-based user onboarding"

entries:
  # ── Flow definition ───────────────────────────────────────────────
  - model: authentik_flows.flow
    identifiers:
      slug: cert-onboarding
    attrs:
      name: "Certificate Onboarding"
      title: "Certificate Onboarding"
      slug: cert-onboarding
      designation: enrollment
      authentication: none
      layout: stacked

  # ── Policy A: cert-lookup ─────────────────────────────────────────
  # Parses the mTLS header and looks up an EXISTING user.
  # Runs at order=0 on the FlowStageBinding (evaluate_on_plan=True).
  # Returns True (and sets pending_user) if the user already exists.
  # Returns False if the user is unknown — defers to cert-create policy.
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: cert-onboarding-lookup-policy
    attrs:
      name: cert-onboarding-lookup-policy
      expression: |
        from urllib.parse import unquote
        from cryptography import x509
        from cryptography.x509.oid import NameOID
        from authentik.core.models import User

        raw = request.http_request.META.get("HTTP_X_AMZN_MTLS_CLIENTCERT_LEAF", "")
        if not raw:
            ak_logger.warning("cert-onboarding: no client certificate presented")
            return False

        # Trust only a header overwritten by our TLS-terminating proxy.
        # unquote (not unquote_plus): '+' is valid in PEM base64.
        try:
            cert = x509.load_pem_x509_certificate(unquote(raw).encode("ascii"))
            names = cert.subject.get_attributes_for_oid(NameOID.COMMON_NAME)
            if len(names) != 1:
                return False
            cn = names[0].value
        except (ValueError, TypeError, UnicodeError):
            return False
        tokens = cn.split() if cn else []
        if not tokens or not tokens[0].isdigit():
            ak_logger.warning("cert-onboarding: invalid CN: %s", cn)
            return False

        username = tokens[0]
        user = User.objects.filter(username=username).first()
        if not user:
            return False  # unknown user — let cert-create policy handle it

        plan = request.context.get("flow_plan")
        if plan is None:
            return False
        plan.context["pending_user"] = user
        plan.context["cert_verified"] = True
        plan.context["prompt_data"] = {}
        return True

  # ── Policy B: cert-create ─────────────────────────────────────────
  # JIT-provisions a NEW user from the cert subject and sets pending_user.
  # Runs at order=1 on the FlowStageBinding (evaluate_on_plan=True).
  #
  # Enrollment on/off: disable this PolicyBinding in the Authentik admin GUI
  # (Flows & Stages → Flows → cert-onboarding → Bindings → cert-create → toggle)
  # or via Ansible: ansible-playbook deploy.yml -e enrollment_enabled=false
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: cert-onboarding-create-policy
    attrs:
      name: cert-onboarding-create-policy
      expression: |
        from urllib.parse import unquote
        from cryptography import x509
        from cryptography.x509.oid import NameOID
        from authentik.core.models import User, Group

        plan = request.context.get("flow_plan")
        if plan is None:
            return False

        # Skip creation if lookup already resolved the user
        if plan.context.get("pending_user"):
            return True

        raw = request.http_request.META.get("HTTP_X_AMZN_MTLS_CLIENTCERT_LEAF", "")
        if not raw:
            return False

        # Trust only a header overwritten by our TLS-terminating proxy.
        # unquote (not unquote_plus): '+' is valid in PEM base64.
        try:
            cert = x509.load_pem_x509_certificate(unquote(raw).encode("ascii"))
            names = cert.subject.get_attributes_for_oid(NameOID.COMMON_NAME)
            if len(names) != 1:
                return False
            cn = names[0].value
        except (ValueError, TypeError, UnicodeError):
            return False
        tokens = cn.split() if cn else []
        if not tokens or not tokens[0].isdigit():
            return False

        username = tokens[0]
        name_tokens = tokens[1:-1] if len(tokens) > 1 and tokens[-1].isdigit() else tokens[1:]
        full_name = " ".join(name_tokens)
        emails = cert.subject.get_attributes_for_oid(NameOID.EMAIL_ADDRESS)
        email = emails[0].value if emails else ""

        user, created = User.objects.get_or_create(
            username=username,
            defaults={
                "name": full_name,
                "email": email,
                "is_active": True,
                "password": "!",  # unusable until the required password stage completes
                "attributes": {"enrollment_source": "x509"},
            },
        )
        group, _ = Group.objects.get_or_create(name="cert-users")
        user.ak_groups.add(group)

        if created:
            # Audit event — visible to admins in Events → Audit Log
            ak_create_event(
                "cert_enrollment",
                message=f"New certificate enrollment: {username} ({full_name}, {email})",
            )
            # In-app bell notification for superuser-group members (if configured)
            try:
                from authentik.events.models import Notification
                from authentik.core.models import Group
                admins = User.objects.filter(
                    ak_groups__in=Group.objects.filter(is_superuser=True)
                ).distinct()
                for admin in admins:
                    Notification.objects.create(
                        user=admin, body=f"New certificate enrollment: {username} ({full_name}, {email})",
                        seen=False, severity="notice",
                    )
            except Exception as e:
                ak_logger.warning("cert-onboarding: bell notification failed: %s", e)

            # Keep enrollment provenance in the flow context. Password gates
            # also cover returning users whose setup was interrupted.
            plan.context["is_new_user"] = True

        plan.context["pending_user"] = user
        plan.context["cert_verified"] = True
        plan.context["prompt_data"] = {}
        return True

  # Keep the historic policy name so existing API bindings are updated in place.
  # Evaluate once at planning for BOTH prompt and write; re-evaluating after
  # saving the password would incorrectly skip the write or change the plan.
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: cert-onboarding-new-user-gate
    attrs:
      name: cert-onboarding-new-user-gate
      expression: |
        plan = request.context.get("flow_plan")
        if plan is None or not plan.context.get("cert_verified"):
            return False
        user = plan.context.get("pending_user")
        return bool(user and (not user.password or not user.has_usable_password()))

  # Used at execution time after password setup, including for existing users.
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: cert-onboarding-ready
    attrs:
      name: cert-onboarding-ready
      expression: |
        plan = request.context.get("flow_plan")
        if plan is None or not plan.context.get("cert_verified"):
            return False
        user = plan.context.get("pending_user")
        return bool(user and user.is_active and user.password and user.has_usable_password())

  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: cert-onboarding-select-totp
    attrs:
      name: cert-onboarding-select-totp
      expression: |
        return request.context.get("prompt_data", {}).get("onboarding_authenticator") == "totp"

  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: cert-onboarding-select-passkey
    attrs:
      name: cert-onboarding-select-passkey
      expression: |
        return request.context.get("prompt_data", {}).get("onboarding_authenticator") == "passkey"

  # Dedicated fields: do not change Authentik's shared password prompts.
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: cert-onboarding-password
    attrs:
      field_key: password
      label: "パスワード"
      type: password
      required: true
      order: 0
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: cert-onboarding-password-repeat
    attrs:
      field_key: password_repeat
      label: "パスワード（確認）"
      type: password
      required: true
      order: 1
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: cert-onboarding-prompt-password
    attrs:
      continue_flow_without_input: false
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, cert-onboarding-password]]
        - !Find [authentik_stages_prompt.prompt, [name, cert-onboarding-password-repeat]]

  - model: authentik_stages_prompt.prompt
    identifiers:
      name: cert-onboarding-authenticator-choice
    attrs:
      field_key: onboarding_authenticator
      label: "MFA／Passkey の登録（任意）"
      type: radio-button-group
      required: true
      order: 0
      initial_value: passkey
      sub_text: "今回はスキップして、後からユーザー設定で登録することもできます。"
      placeholder_expression: true
      placeholder: |
        return [
            {"label": "Passkey を登録", "value": "passkey"},
            {"label": "認証アプリ（TOTP）を登録", "value": "totp"},
            {"label": "今回はスキップ", "value": "skip"},
        ]
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: cert-onboarding-choose-authenticator
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, cert-onboarding-authenticator-choice]]

  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    identifiers:
      name: cert-onboarding-totp
    attrs:
      friendly_name: "認証アプリ（TOTP）"
      digits: 6
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    identifiers:
      name: cert-onboarding-passkey
    attrs:
      friendly_name: "Passkey"
      user_verification: required
      resident_key_requirement: required

  - model: authentik_stages_user_write.userwritestage
    identifiers:
      name: cert-onboarding-user-write
    attrs:
      user_creation_mode: never_create
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: cert-onboarding-user-login
    attrs:
      session_duration: "hours=8"
      remember_me_offset: "days=0"

  # Lookup/create policies resolve pending_user at planning time and initialize
  # empty prompt_data. This write is deliberately empty: it establishes no
  # authenticated session. Login happens only at order 80 after credentials.
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, cert-onboarding]]
      order: 20
    attrs:
      stage: !Find [authentik_stages_user_write.userwritestage, [name, cert-onboarding-user-write]]
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, cert-onboarding]]
      order: 30
    attrs:
      stage: !Find [authentik_stages_prompt.promptstage, [name, cert-onboarding-prompt-password]]
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, cert-onboarding]]
      order: 40
    attrs:
      stage: !Find [authentik_stages_user_write.userwritestage, [name, cert-onboarding-user-write]]
      evaluate_on_plan: true
      re_evaluate_policies: false

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, cert-onboarding]]
      order: 50
    attrs:
      stage: !Find [authentik_stages_prompt.promptstage, [name, cert-onboarding-choose-authenticator]]
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, cert-onboarding]]
      order: 60
    attrs:
      stage: !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, cert-onboarding-totp]]
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, cert-onboarding]]
      order: 70
    attrs:
      stage: !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, cert-onboarding-passkey]]
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, cert-onboarding]]
      order: 80
    attrs:
      stage: !Find [authentik_stages_user_login.userloginstage, [name, cert-onboarding-user-login]]
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  # ── Notification: local bell on new enrollment ───────────────────
  # When cert-create policy fires ak_create_event("cert_enrollment", ...),
  # Authentik matches it against NotificationRules. This rule sends a bell
  # notification to members of any group with is_superuser=True.
  # PolicyBinding (event-matcher policy → NotificationRule) is created via Ansible.

  - model: authentik_events.notificationtransport
    identifiers:
      name: cert-enrollment-local
    attrs:
      name: cert-enrollment-local
      mode: local
      send_once: false

  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: cert-enrollment-event-matcher
    attrs:
      name: cert-enrollment-event-matcher
      expression: |
        event = request.context.get("event")
        if not event:
            return False
        action = event.action if hasattr(event, "action") else event.get("action", "")
        return action == "custom_cert_enrollment"

  - model: authentik_events.notificationrule
    identifiers:
      name: cert-enrollment-notify
    attrs:
      name: cert-enrollment-notify
      severity: notice
      enabled: true
      transports:
        - !Find [authentik_events.notificationtransport, [name, cert-enrollment-local]]

  # NOTE: PolicyBindings (cert-lookup and cert-create → FlowStageBinding, and
  # event-matcher → NotificationRule) are created via Ansible REST API calls.
  # Blueprint PolicyBinding entries cause UUID-conflict errors on re-apply.
  #
  # The Ansible API token (ansible-automation-token) is created by Authentik's
  # AUTHENTIK_BOOTSTRAP_TOKEN env var on first startup (set via Helm bootstrap_token).
  #
  # Enrollment on/off (admin GUI):
  #   Flows & Stages → Flows → cert-onboarding → Bindings
  #   → disable/enable the cert-create PolicyBinding
  # Enrollment on/off (Ansible):
  #   ansible-playbook deploy.yml -e enrollment_enabled=false
