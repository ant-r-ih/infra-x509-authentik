controller:
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    # Pass ALB mTLS headers through to upstream without stripping
    # Raw header: X-Amzn-Mtls-Clientcert-Subject (URL-encoded RFC 4514 DN)
    # Parsing is done in Authentik expression stages (Python)
    proxy-set-headers: "ingress-nginx/custom-proxy-headers"

  service:
    type: NodePort
    nodePorts:
      https: 30443

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  admissionWebhooks:
    enabled: true

  metrics:
    enabled: false

defaultBackend:
  enabled: false
