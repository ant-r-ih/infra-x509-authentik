# Pass ALB mTLS client cert headers through to Authentik unchanged.
# Authentik expression stages parse the URL-encoded DN in Python.
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-proxy-headers
  namespace: ingress-nginx
data:
  X-Amzn-Mtls-Clientcert-Subject: "$http_x_amzn_mtls_clientcert_subject"
  X-Amzn-Mtls-Clientcert-Sans: "$http_x_amzn_mtls_clientcert_sans"
